[package]
name = "grindvakt-core"
version = "1.1.2"
edition = "2024"
rust-version = "1.99"
description = "The Grindvakt dynamic DNS engine as a library: keep A, AAAA, TXT (including libp2p _dnsaddr) and CNAME records current on DNSimple or DigitalOcean. Separate IPv4/IPv6 discovery that reports when there is no global address, a plan/apply split with dry runs, a provider trait and typed errors. Caller-owned secrets and paths, no CLI, no prompts, no scheduler. Optional encrypted token vault."
license = "BSD-3-Clause"
authors = ["Michael Christenson II <m3talsmith@gmail.com>"]
repository = "https://github.com/WeirdBrains/grindvakt-core"
homepage = "https://grindvakt.weirdbrains.com/"
documentation = "https://docs.rs/grindvakt-core"
readme = "README.md"
keywords = ["dns", "ddns", "dynamic-dns", "dnsimple", "digitalocean"]
categories = ["network-programming", "cryptography", "api-bindings"]
include = [
  "/src/**/*.rs",
  "/examples/**/*.rs",
  "/tests/**/*.rs",
  "/tests/fixtures/**",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/Cargo.toml",
]

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-pc-windows-msvc"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["dnsimple", "digitalocean", "public-ip"]
## DNSimple provider (official `dnsimple` crate, reqwest + rustls).
dnsimple = ["dep:dnsimple", "dep:tokio"]
## DigitalOcean provider (REST over reqwest + rustls).
digitalocean = ["dep:reqwest", "dep:tokio"]
## Public IPv4/IPv6 discovery over HTTPS echo services.
public-ip = ["dep:reqwest", "dep:futures-util", "dep:tokio", "tokio/net"]
## Encrypted token vault (Argon2id + 24-word recovery, XChaCha20-Poly1305 via weirdnet-keys).
vault = ["dep:weirdnet-keys", "dep:base64", "dep:zeroize", "dep:chrono"]
## The standalone Grindvakt app's config file, default paths, single-A sync and conflict detection.
standalone = ["dep:toml", "dep:directories"]

[dependencies]
fs2 = "0.4"
regex = "1.10"
secrecy = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
base64 = { version = "0.21", optional = true }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"], optional = true }
directories = { version = "5.0", optional = true }
dnsimple = { version = "8.0.0", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["alloc"], optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"], optional = true }
tokio = { version = "1.41", features = ["time"], optional = true }
toml = { version = "0.8", optional = true }
weirdnet-keys = { version = "0.1", default-features = false, optional = true }
zeroize = { version = "1.7", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
tempfile = "3.10"

[target.'cfg(windows)'.dependencies]
uuid = { version = "1.10", features = ["v4"] }
widestring = "1.1"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
] }

[dev-dependencies]
assert_fs = "1.1"
serial_test = "3.1"
tempfile = "3.10"
tokio = { version = "1.41", features = ["rt-multi-thread", "macros", "time", "sync"] }
wiremock = "0.6"

[[example]]
name = "config_load"
required-features = ["standalone"]

[[example]]
name = "vault_roundtrip"
required-features = ["vault"]

[[example]]
name = "dns_plan_dry_run"
required-features = ["dnsimple"]

[[example]]
name = "embed_in_app"
required-features = ["digitalocean"]

[[example]]
name = "ip_discovery"
required-features = ["public-ip"]

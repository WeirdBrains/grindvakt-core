name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Read-only token everywhere; no job writes to the repo.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust stable with rustfmt and clippy
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy (all features)
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: clippy (no default features)
        run: cargo clippy --all-targets --no-default-features --locked -- -D warnings
      - name: test (all features)
        run: cargo test --all-features --locked
      - name: test (no default features)
        run: cargo test --no-default-features --locked
      - name: each feature alone
        shell: bash
        run: |
          for f in dnsimple digitalocean public-ip vault standalone; do
            cargo clippy --all-targets --no-default-features --features "$f" --locked -- -D warnings
          done
      - name: examples
        shell: bash
        run: |
          for e in config_load vault_roundtrip ip_discovery dns_plan_dry_run embed_in_app; do
            cargo run --locked --all-features --example "$e"
          done
      - name: package
        if: runner.os == 'Linux'
        run: cargo package --locked

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust stable with Android targets
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-linux-android --target x86_64-linux-android
          rustup default stable
      - name: cargo check (Android, NDK clang)
        shell: bash
        run: |
          TC="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$TC/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$TC/llvm-ar"
          export CC_x86_64_linux_android="$TC/x86_64-linux-android24-clang"
          export AR_x86_64_linux_android="$TC/llvm-ar"
          for t in aarch64-linux-android x86_64-linux-android; do
            cargo check --locked --all-features --target "$t"
            cargo check --locked --target "$t"
          done

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust stable with iOS targets
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-apple-ios --target aarch64-apple-ios-sim
          rustup default stable
      - name: cargo check (iOS)
        run: |
          for t in aarch64-apple-ios aarch64-apple-ios-sim; do
            cargo check --locked --all-features --target "$t"
            cargo check --locked --target "$t"
          done

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust 1.99 (MSRV)
        run: |
          rustup toolchain install 1.99 --profile minimal
          rustup default 1.99
      - run: cargo check --all-features --locked
      - run: cargo check --no-default-features --locked

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust nightly (docs.rs)
        run: |
          rustup toolchain install nightly --profile minimal
          rustup default nightly
      - name: docs.rs build
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings
        run: cargo doc --all-features --no-deps --locked
